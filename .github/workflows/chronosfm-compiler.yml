name: ChronoSFM Compiler

on:
  push:
    branches:
      - main
      - feat/chronosfm-compiler-bootstrap
    paths:
      - 'chronosfm-compiler/**'
      - '.github/workflows/chronosfm-compiler.yml'
  pull_request:
    paths:
      - 'chronosfm-compiler/**'
      - '.github/workflows/chronosfm-compiler.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test compiler
        working-directory: chronosfm-compiler
        run: ../gradlew -p . test
      - name: Compiler scaling smoke benchmark
        working-directory: chronosfm-compiler
        run: ../gradlew -p . runCompilerBenchmark --args='100000'
