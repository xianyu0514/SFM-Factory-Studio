org.gradle.jvmargs=-Xmx4G -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false

# 本地代理已移除（2026-10-23）。原因：5606 端口未监听时，NeoGradle 在 neoForm
# 阶段会静默挂起十几分钟——无输出、无报错、build/ 目录零变化，与"卡死"无法区分
# （本次排查定位它花了 10 分钟）。依赖已全部缓存，直连即可构建。
# 需要走代理时，取消下面四行注释并把端口改成实际值。
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=5606
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=5606
systemProp.http.nonProxyHosts=localhost|127.0.0.1

# Environment：与 SFM 本体 26.1.2 线保持一致
# (SFM 本体见 platform/minecraft/gradle.properties: mc 26.1.2 / neo 26.1.2.72)
# 26.1 起 MC 不再提供 Parchment，直接用官方映射（沿用 1.21.1 时代的参数名）
minecraft_version=26.1.2
# 下限必须是 26.1.2：NeoForge 版本号前两段就是 MC 版本（26.1.0.x=MC 26.1，
# 26.1.2.x=MC 26.1.2），而 neo_version_range 要求 26.1.2.29+。若这里写 26.1，
# MC 26.1 的玩家会被 neo 依赖拦下，却看到 "requires neoforge 26.1.2.29" 这种
# 指错方向的报错。本模组只在 26.1.2 上编译与测试过，范围就如实收窄。
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.99
neo_version_range=[26.1.2.29-beta,)
loader_version_range=[4,)

# Mod properties
mod_id=sfmfactorystudio
mod_name=SFM Factory Studio (SFM 智造工坊)
mod_license=Mozilla Public License Version 2.0
mod_version=1.0
mod_group_id=io.github.xianynomial.sfmfactorystudio
mod_authors=Xianynomial (based on SFM-GUI by TeamDman/Mimosa_LW)
mod_description=Bilingual visual programming companion for Super Factory Manager: blocks and SFML source side-by-side, both-way editing. 为 Super Factory Manager 提供积木与 SFML 源码并排编辑的中英双语可视化编程伴侣。Website: https://xianyu0514.github.io/salty-lab

# The SFM jar this addon compiles and runs against (26.1.2)
sfm_jar=libs/sfm-26.1.2-4.34.0.jar

# MC 26.x 需要 Java 25（Zulu 25.0.3）
org.gradle.java.home=C:/Program Files/Zulu/zulu-25

# Flaky-network resilience: retry maven downloads several times before failing
org.gradle.internal.repository.max.tentatives=8
org.gradle.internal.repository.initial.connection.timeout=60000
org.gradle.internal.repository.initial.retry=20000
