org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv6Addresses=true
org.gradle.daemon=false

# Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=1.20.1-47.3.0
forge_version_range=[47,)
loader_version_range=[47,)

# Mod properties
mod_id=sfmfactorystudio
mod_name=SFM Factory Studio (SFM 智造工坊)
mod_license=Mozilla Public License Version 2.0
mod_version=0.8
mod_group_id=io.github.xianynomial.sfmfactorystudio
mod_authors=Xianynomial (based on SFM-GUI by TeamDman/Mimosa_LW)
mod_description=Bilingual visual programming companion for Super Factory Manager: blocks and SFML source side-by-side, both-way editing. 为 Super Factory Manager 打造的中英双语可视化编程附属。

# The SFM jar this addon compiles and runs against (place in ./libs)
sfm_artifact=libs:sfm-1.20.1:4.34.0

# JEI (optional integration)
jei_version=15.56.0.205

# Run Gradle itself on JDK 21 (Gradle 8.x cannot run on Java 25)
org.gradle.java.home=D:/youxi/tools/zulu21.52.203-ca-fx-jdk21.0.12.1-win_x64

# Flaky-network resilience: retry maven downloads several times before failing
org.gradle.internal.repository.max.tentatives=8
org.gradle.internal.repository.initial.connection.timeout=60000
org.gradle.internal.repository.initial.retry=20000

# ForgeGradle's plugin-apply ping (EnvironmentChecks) uses a raw
# HttpsURLConnection with no timeout; on machines where the direct route to
# maven.minecraftforge.net stalls, the build hangs forever before any task
# runs. Gradle itself downloads from the same host fine (with retries), so
# skipping the ping is safe here.
systemProp.forgegradle.env_check=false
# Same flaky-proxy story: FG's pre-flight certificate validation fails when
# the local proxy's TLS passthrough hiccups, killing configuration before any
# task runs. Gradle's own downloads still validate certificates normally.
systemProp.net.minecraftforge.gradle.check.certs=false

# ForgeGradle's MavenArtifactDownloader also uses raw HttpsURLConnection
# (no timeout, no retries). Proxy config was removed 2026-09-05: the local
# proxy was shut down and direct routes work again. If TLS hangs return,
# re-add systemProp.http(s).proxyHost=127.0.0.1 / proxyPort=7890.
