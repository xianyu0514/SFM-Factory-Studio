name: ChronoSFM Compiler

on:
  push:
    branches:
      - main
      - feat/chronosfm-compiler-bootstrap
    paths:
      - 'chronosfm-compiler/**'
      - 'src/main/java/io/github/xianynomial/sfmfactorystudio/chronosfm/**'
      - 'src/main/java/io/github/xianynomial/sfmfactorystudio/mixin/ManagerTickMixin.java'
      - 'src/test/java/io/github/xianynomial/sfmfactorystudio/chronosfm/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/chronosfm-compiler.yml'
  pull_request:
    paths:
      - 'chronosfm-compiler/**'
      - 'src/main/java/io/github/xianynomial/sfmfactorystudio/chronosfm/**'
      - 'src/main/java/io/github/xianynomial/sfmfactorystudio/mixin/ManagerTickMixin.java'
      - 'src/test/java/io/github/xianynomial/sfmfactorystudio/chronosfm/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/chronosfm-compiler.yml'

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Test compiler core
        working-directory: chronosfm-compiler
        run: ../gradlew -p . test
      - name: Compiler scaling smoke benchmark
        working-directory: chronosfm-compiler
        run: ../gradlew -p . runCompilerBenchmark --args='100000'

  sfm-1-21-1-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Download official SFM 4.34.0 for MC 1.21.1
        run: |
          mkdir -p libs
          curl -fL --retry 4 --retry-delay 2             -o libs/sfm-4.34.0.jar             "https://github.com/TeamDman/SuperFactoryManager/releases/download/4.34.0-26.1.2/Super.Factory.Manager.SFM.-MC1.21.1-4.34.0.jar"
          echo "4b589e0b310133998f26f0c12c3ee8d367360be1771e0e96c951322cea6c7ad0  libs/sfm-4.34.0.jar" | sha256sum -c -
      - name: Compile and test real SFM adapter
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" test --tests 'io.github.xianynomial.sfmfactorystudio.chronosfm.SfmProgramAdapterTest'
